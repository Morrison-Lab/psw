# Thin caller of Morrison-Lab/gha's reusable self-credits check.
#
# The lab does not formally acknowledge its own sites, tooling or templates
# (Ezra, 2026-10-16 and 2026-10-26). A `Source:` line, an "adapted from" or
# "built from" sentence, or an Acknowledgments section naming one of the
# entries in .github/own-works.yml is flagged on the lines a PR adds.
# Links for further reading are never flagged.
name: Check Self-Credits

on:
  pull_request:
    paths:
      - '**.md'
      - '**.qmd'
      - '.github/own-works.yml'
  workflow_dispatch:

jobs:
  check-self-credits:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-self-credits.yml@v3
    with:
      paths-ignore: '_extensions/**,latex-macros/**'
      fail: true
