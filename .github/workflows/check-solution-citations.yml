# Thin caller of Morrison-Lab/gha's reusable solution-citations check.
# It flags a `@sol-` cross-reference inside a proof or result div.
# Blocking and diff-scoped: it fails a PR only for lines the PR adds.
# No `push` trigger: with no PR base to diff against, the reusable workflow
# skips, so a push run would report success, having checked nothing.

name: Check solution-citations

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-solution-citations.yml@v3
    with:
      paths-ignore: '_extensions/**,latex-macros/**'
      whole-tree: ${{ github.event_name == 'workflow_dispatch' }}
