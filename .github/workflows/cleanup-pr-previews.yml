# Housekeeping half of the PR-preview family: periodically deletes gh-pages
# preview directories for PRs that are no longer open, so closed previews stop
# accumulating. The calling job grants contents:write so it can commit the
# deletions back to gh-pages.
#
# Do NOT name a `concurrency:` group `gh-pages` in this caller (deadlock,
# https://github.com/Morrison-Lab/gha/issues/809).
name: Clean up PR Previews

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight UTC

jobs:
  cleanup:
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: Morrison-Lab/gha/.github/workflows/cleanup-pr-previews.yml@v3
